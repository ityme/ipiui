    <text x="20" y="68" fill="#94a3b8">Chat transcript lines…</text>

    <!-- State 1: RUNNING (Module 1 Status + Module 2 Project/Branch + Module 3 Rainbow Model/Thinking + Module 4 Telemetry + Module 5 CTX) -->
    <!-- M1: [⠋ RUN 6s] - Coral/Amber bg -->
    <rect x="12" y="98" width="168" height="28" rx="4" fill="#3d2b0f"/>
