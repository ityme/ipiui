      <tspan fill="#94a3b8">[</tspan>
      <tspan fill="#ff6e82">🤖</tspan><tspan fill="#ff7d76"> </tspan><tspan fill="#ff8c6b">c</tspan><tspan fill="#ff9b5f">l</tspan><tspan fill="#ffaa54">a</tspan><tspan fill="#e5b452">u</tspan><tspan fill="#c6be51">d</tspan><tspan fill="#a6c850">e</tspan><tspan fill="#87d24e">-</tspan><tspan fill="#68dc4d">3</tspan><tspan fill="#4fe06c">-</tspan><tspan fill="#54db90">7</tspan><tspan fill="#5ad6b4">-</tspan><tspan fill="#5fd1d8">s</tspan><tspan fill="#64cbfc">o</tspan><tspan fill="#71beff">n</tspan><tspan fill="#85aeff">n</tspan><tspan fill="#9a9eff">e</tspan><tspan fill="#ad8eff">t</tspan><tspan fill="#c07eff"> </tspan><tspan fill="#d46efe">·</tspan><tspan fill="#e75efe"> </tspan><tspan fill="#fa4efe">h</tspan><tspan fill="#f964e5">i</tspan><tspan fill="#f978cb">g</tspan><tspan fill="#fa8cb1">h</tspan>
      <tspan fill="#94a3b8">]</tspan>
    </text>

    <rect x="724" y="228" width="290" height="28" rx="4" fill="#0e3020"/>
    <text x="730" y="247" font-weight="700">
      <tspan fill="#94a3b8">[</tspan>
      <tspan fill="#60a5fa">⬆️22.0k</tspan>
      <tspan fill="#34d399"> ⬇️3.4k</tspan>
      <tspan fill="#fbbf24"> 💰 0.06¥</tspan>
