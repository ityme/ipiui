    <rect x="724" y="98" width="290" height="28" rx="4" fill="#0e3020"/>
    <text x="730" y="117" font-weight="700">
      <tspan fill="#94a3b8">[</tspan>
      <tspan fill="#60a5fa">⬆️68.7M</tspan>
      <tspan fill="#34d399"> ⬇️349.9k</tspan>
      <tspan fill="#fbbf24"> 💰 176.08¥</tspan>
      <tspan fill="#94a3b8">]</tspan>
