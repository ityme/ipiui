    <text x="1030" y="247" font-weight="700">
      <tspan fill="#94a3b8">[</tspan>
      <tspan fill="#cbd5e1">CTX </tspan>
      <tspan fill="#2dd4bf">━</tspan>
      <tspan fill="#94a3b8">─────── </tspan>
      <tspan fill="#2dd4bf">12% </tspan>
      <tspan fill="#cbd5e1">24.5k/200k</tspan>
      <tspan fill="#94a3b8">]</tspan>
