      <tspan fill="#fbbf24">━━━━━━</tspan>
      <tspan fill="#94a3b8">── </tspan>
      <tspan fill="#fbbf24">75% </tspan>
      <tspan fill="#cbd5e1">786.3k/1M</tspan>
      <tspan fill="#94a3b8">]</tspan>
