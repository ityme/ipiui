<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" role="img" aria-label="Rainbow blocks layout with 5 distinct modules, colored text, and rainbow letters">
  <defs>
    <style>
      .mono { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 13.5px; }
    </style>
  </defs>
  <rect width="1440" height="340" fill="#090b10"/>
