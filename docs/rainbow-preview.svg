<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" role="img" aria-label="Subdued flowing rainbow background with compact status symbols and full-width auto-fill trailing border">
  <defs>
    <!-- Soft subdued dark rainbow gradient (28% tint with #141821 base) -->
    <linearGradient id="soft-rainbow-dark" x1="0" y1="0" x2="1" y2="0" color-interpolation="sRGB">
      <stop offset="0%" stop-color="#562c39"/>
      <stop offset="16.6%" stop-color="#563e2b"/>
      <stop offset="33.3%" stop-color="#534d2e"/>
      <stop offset="50%" stop-color="#224d3f"/>
      <stop offset="66.6%" stop-color="#1f485c"/>
      <stop offset="83.3%" stop-color="#333b5e"/>
      <stop offset="100%" stop-color="#4b335b"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="340" fill="#0f131a"/>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="16">
    <!-- Tab Title Bar Preview -->
    <text x="20" y="34" fill="#64748b">Windows Terminal Tab Title: <tspan fill="#38bdf8" font-weight="700">[1▶api 2✓web 3○cmd]</tspan> (compact, auto-grouped)</text>
    <text x="20" y="68" fill="#94a3b8">Chat transcript lines…</text>

    <!-- Bar State: RUNNING with rotating braille & project name & branch & full-width fill line -->
    <rect y="100" width="1440" height="32" fill="url(#soft-rainbow-dark)"/>
    <text x="14" y="122" fill="#f1f5f9">
      <tspan font-weight="700">──── ⠋ 6s (bash) </tspan>
      <tspan>gemini-3.8-flash · </tspan>
      <tspan fill="#e0f2fe" font-weight="700">high</tspan>
      <tspan> · ipiui (dev) · ↑14.2k · ↓1.1k · Σ18.6k · $0.024 · ctx 15.6k/1.0M (2%) ──────────────────────────────────────────────────────────────────</tspan>
    </text>

    <!-- Editor border & input -->
    <path d="M0 148H1440 M0 202H1440" stroke="#334155" stroke-width="1"/>
    <text x="14" y="182" fill="#f8fafc">npm test</text>

    <!-- Bar State: READY with colored thinking level & project & branch & full-width fill line -->
    <rect y="234" width="1440" height="32" fill="url(#soft-rainbow-dark)"/>
    <text x="14" y="256" fill="#f1f5f9">
      <tspan font-weight="700">──── ✓ </tspan>
      <tspan>claude-3-7-sonnet · </tspan>
      <tspan fill="#fef08a" font-weight="700">medium</tspan>
      <tspan> · ipiui (dev) · ↑22.0k · ↓3.4k · Σ25.4k · $0.061 · ctx 24.5k/200k (12%) ────────────────────────────────────────────────────────────</tspan>
    </text>
    <text x="14" y="302" fill="#64748b">Concise symbol status (no long READY text) · Project name &amp; Git branch · Right line auto-fills full terminal width</text>
  </g>
</svg>
